[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xuri-rpc-tcp"
version = "1.0.0"
description = "tcp sender for xuri-rpc"
license = {text = "MIT"}
authors = [
    {name = "prometheus0017"},
]
keywords = ["rpc", "remote", "callback", "tcp"]
requires-python = ">=3.9"
dependencies = [
    "xuri-rpc>=1.0.0",
    "cbor2>=5.4",
]

[tool.setuptools.packages.find]
include = ["xuri_rpc_tcp*"]
