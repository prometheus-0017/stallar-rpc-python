[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xuri-rpc"
version = "2.0.1"
description = "A Python RPC framework with remote callback support"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "prometheus0017"},
]
keywords = ["rpc", "remote", "callback"]
requires-python = ">=3.9"
dependencies = [
    "cbor2>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
include = ["xuri_rpc*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
